# mise.toml - the pinned tools a desk and a runner share; see: https://mise.jdx.dev/configuration/environments.html
#
# mise reads this file always, mise.desk.toml on top of it when MISE_ENV=desk, which a desk exports in its shell
# profile, and mise.ci.toml when MISE_ENV=ci, which the CI workflow sets. A tool goes in the file of whoever runs
# it; Lefthook is a desk's alone, and nothing is the runner's alone. `lockfile = true` records each pin's
# exact resolution in a lock beside its file. git and bash come from the machine.

[settings]
lockfile = true
# A lock written on a desk carries the runner's platform too; see: https://mise.jdx.dev/dev-tools/mise-lock.html
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]

# bin/ on PATH, so `kit` is spelled here as a consumer spells it.
[env]
_.path = ["bin"]

# Why each tool is here:
#   actionlint          the workflows rule's linter, over .github/workflows/, in kit lint and the gate
#   bats                runs tests/, the suite the gate runs
#   gh                  the GitHub provider's tool: the loop's verbs, kit linked, and kit release publish and retire
#   jq                  reads and writes JSON: the merged .claude/settings.json, the forge's documents, kit status
#   just                runs the justfile: just ci, the gate, and just refresh, the installed copies
#   lychee              checks every link in the markdown, offline, fragments included, in the gate
#   ajv-cli             validates every module.yml and .kit/settings.yml against their schemas, in the gate
#   markdownlint-cli2   the markdown rule's linter, over every .md file, in kit lint and the gate
#   shellcheck          the bash rule's linter, over bin/ and tests/, in kit lint and the gate
[tools]
actionlint = "1.7"
bats = "1.14"
gh = "2.103"
jq = "1.8"
just = "1.59"
lychee = "0.24"
"npm:ajv-cli" = "5"
"npm:markdownlint-cli2" = "0.24"
shellcheck = "0.11"
