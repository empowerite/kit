# mise.toml - the pinned toolchain a desk and a runner share; see: https://mise.jdx.dev/configuration.html
#
# Every tool both a desk and a CI runner run, at one version, installed the same way by `mise install` and by
# `jdx/mise-action`. A tool only a desk runs would go in mise.desk.toml, which mise reads when MISE_ENV=desk; a desk
# sets that in its shell profile and a runner leaves it unset. Nothing is desk-only today. `lockfile = true` records each pin's exact
# resolution in mise.lock. git and bash come from the machine.

[settings]
lockfile = true
# A lock written on a desk carries the runner's platform too; see: https://mise.jdx.dev/dev-tools/mise-lock.html
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]

# bin/ on PATH, so `kit` is spelled here as a consumer spells it.
[env]
_.path = ["bin"]

[tools]
actionlint = "1.7"
gh = "2.103"
jq = "1.8"
just = "1.59"
lefthook = "2.2"
shellcheck = "0.11"
bats = "1.13"
