# mise.toml - the pinned tools a desk and a runner share; see: https://mise.jdx.dev/configuration/environments.html
#
# Three files, one mechanism: mise reads this one always, mise.desk.toml on top of it when MISE_ENV=desk, which a
# desk exports in its shell profile, and mise.ci.toml when MISE_ENV=ci, which the CI workflow sets. A tool goes in
# the file of whoever runs it. `lockfile = true` records each pin's exact resolution in a lock beside its file,
# and lockfile_platforms makes a lock written on a desk carry the runner's platform. git and bash come from the
# machine.

[settings]
lockfile = true
# A lock written on a desk carries the runner's platform too; see: https://mise.jdx.dev/dev-tools/mise-lock.html
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]

# bin/ on PATH, so `kit` is spelled here as a consumer spells it.
[env]
_.path = ["bin"]

[tools]
gh = "2.103"
jq = "1.8"
just = "1.59"
shellcheck = "0.11"
bats = "1.13"
