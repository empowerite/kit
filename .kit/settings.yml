# yaml-language-server: $schema=settings.schema.json
require_signing: true
gate: bin/ci
# The commit-subject rule is off for the history of #1, the first release, whose early commits predate it. Remove
# this comment and the two lines below once that pull request merges, and the kit's default applies again.
policy:
  commit_subject: ''

version: unreleased
packages:
  - kit
  - agents/claude
  - github/ci
  - hooks/lefthook
  - style/bash
  - style/gitignore
  - style/json
  - style/just
  - style/markdown
  - style/prose
  - style/workflows
  - style/yaml
  - empowerite
  - house
