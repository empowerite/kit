# .kit/packages/house/package.yml - the house package: this repository's own taste, kept out of the kit it delivers
# ----------------------------------------------------------------------------------------------------------------------
# The kit delivers its style as optional packages, one per kind of file. This repository takes the empowerite bundle,
# which brings all of them, and this package goes further: it replaces some of their templates, so kit new file
# makes, and kit lint requires, a line of dashes to column 120 under the banner and at the end of the file. A
# repository that installs the kit never sees this package.
#
# see: docs/packages.md

description: "This repository's own style: the empowerite bundle, and templates with a line of dashes under the banner"
depends:
  - empowerite
