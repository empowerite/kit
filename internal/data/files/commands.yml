# commands.yml - kit's commands: the words of each, its options, and its help
#
# From this file come the command line's parsing, its help, and what each command's --json prints names. --json and
# --help are every command's, so no command names them.
commands:
  - words: [version]
    summary: say which build this is
    help: |
      Says the commit this build of kit was made from, when that commit was made, and whether the tree held changes
      the commit does not. A build does not know its release: a release is a tag put afterwards on a commit whose
      build exists, and two releases can name one build.

  - words: [data, show]
    summary: print one of kit's own data files
    help: |
      Prints one of the data files kit holds inside itself, as kit reads it: its commands, and its other defaults. A
      repository's own files are laid over these.
    args:
      - name: name

  - words: [tools, add]
    summary: pin a tool, and lock it for every platform
    help: |
      Pins a tool in kit.yml, at the version given, or at its newest release, and locks it in kit.lock for macOS and
      Linux, each on arm64 and x86-64. For each platform kit downloads the tool's file, takes its sha256, and holds
      it to the digest GitHub keeps and to the checksum the tool publishes; a digest nothing confirms is refused. It
      shows its plan, and changes nothing until you approve it.
    options:
      - name: unconfirmed
        help: pin a file that neither GitHub nor the tool confirms, on kit's own download alone
      - name: plan
        help: print the plan, and change nothing
    args:
      - name: tool[@version]

  - words: [tools, lock]
    summary: lock every pinned tool again, for every platform
    help: |
      Makes kit.lock again from the tools kit.yml pins: for each one and each platform, the file, its sha256, and the
      program's own. It shows its plan, and changes nothing until you approve it.
    options:
      - name: unconfirmed
        help: pin a file that neither GitHub nor the tool confirms, on kit's own download alone
      - name: plan
        help: print the plan, and change nothing
