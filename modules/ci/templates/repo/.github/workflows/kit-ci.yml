# kit-ci.yml - the check the kit delivers: the repository's gate, the kit's own check, and the issue link
# ----------------------------------------------------------------------------------------------------------------------
#
# One job, CI, which is the check name a ruleset requires, run for a pull request into the default branch. After
# a step that confirms kit is on PATH, three checks, each one kit command, so what the runner does a desk can do:
# `kit gate` runs the root justfile's ci recipe and refuses when there is none, `kit check` holds every delivered
# file to the pinned release, and `kit linked` refuses a pull request not linked to an open issue of this
# repository under Development. The last two run even when an earlier step refused, so one run reports every
# finding.
#
# Delivered by kit, not edited by hand. A change is a new release, then kit update. runs-on is the ci_runner answer.
#
# see: .kit/1st.md

name: kit

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  CI:
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: "@ci_runner@"
    env:
      # mise reads mise.ci.toml on top of mise.toml: the tools only a runner runs.
      MISE_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Every tool below comes from mise.toml, the kit included; this repository's mise.toml puts bin/ on PATH.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0

      - name: kit-on-path
        run: |
          command -v kit >/dev/null && exit 0
          echo '::error::pin "github:empowerite/kit" in mise.toml; kit is not on PATH' && exit 1

      - name: gate
        run: kit gate

      - name: kit-check
        if: ${{ !cancelled() }}
        run: kit check

      - name: linked-open-issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: kit linked

# ----------------------------------------------------------------------------------------------------------------------
