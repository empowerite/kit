# Delivered by kit, not edited by hand. A change is a new release, then kit update.
#
# The pre-commit hook runs kit lint over the staged paths: each rule's own linter, declared in the rule's
# frontmatter, over the paths the rule governs. The repository's lefthook.yml takes this with
# `extends: [.kit/lefthook.yml]` and adds commands of its own; Lefthook merges by name. Once per clone:
# lefthook install
#
# see: https://lefthook.dev

pre-commit:
  commands:
    kit-lint:
      run: kit lint {staged_files}
    kit-generate:
      run: kit generate --check {staged_files}
