# dependabot.yml - keeps the SHA-pinned actions in the workflows current
# ----------------------------------------------------------------------------------------------------------------------
#
# Every `uses:` in .github/workflows/ is pinned to a full commit SHA, with the version as a trailing comment. The SHA
# advances when a pull request from Dependabot's github-actions ecosystem merges: once a week, it opens one that
# moves each SHA and its comment together. The tools come from mise.toml, which Dependabot does not read;
# `mise outdated` answers for those.
#
# see: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

# ----------------------------------------------------------------------------------------------------------------------
