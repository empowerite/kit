# retire-pre-releases.yml - a pre-release lives as long as the branch it was tagged on
# ----------------------------------------------------------------------------------------------------------------------
#
# One step, one kit command: on every branch deletion, `kit release retire` deletes, tag and all, each pre-release
# whose commit no remaining branch reaches. A release is never touched: it is on main, which is never deleted. A
# deleted tag is a delete event too, and that one is ignored here.
#
# see: bin/kit-release.sh, .github/workflows/release.yml

name: retire-pre-releases

on:
  delete:

permissions:
  contents: write

jobs:
  retire:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: retire
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/kit release retire

# ----------------------------------------------------------------------------------------------------------------------
