# retire-pre-releases.yml - deleting a branch deletes the pre-releases that were made from it
# ----------------------------------------------------------------------------------------------------------------------
#
# Deleting a branch on GitHub runs this workflow. Its one step is one kit command: kit release retire deletes
# every pre-release, tag included, whose commit is no longer on any branch. A release is never deleted, because
# it is on main and main is never deleted. Deleting a tag also sends a delete event, and that one is ignored.
#
# see: bin/kit-release.sh, .github/workflows/release.yml

name: retire-pre-releases

on:
  delete:

permissions:
  contents: write

jobs:
  retire:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: retire
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/kit release retire

# ----------------------------------------------------------------------------------------------------------------------
