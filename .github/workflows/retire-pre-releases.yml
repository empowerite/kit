# retire-pre-releases.yml - a pre-release lives as long as the branch it was tagged on
# ----------------------------------------------------------------------------------------------------------------------
#
# A pre-release is tagged on a commit that is not on main, and main takes a branch by squash, so once the branch is
# deleted its commits are reachable from nothing but the pre-release's own tag. This runs on every branch deletion
# and retires, tag and all, each pre-release whose commit no remaining branch reaches. A release is never touched:
# it is on main, which is never deleted. A deleted tag is a delete event too, and that one is ignored here.
#
# Checked by hand: an immutable pre-release deletes with its tag, and the tag name can never be reused.
#
# see: .github/workflows/release.yml

name: retire-pre-releases

on:
  delete:

permissions:
  contents: write

jobs:
  retire:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: retire-unreachable-pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o errexit -o nounset -o pipefail
          git fetch --quiet --tags origin
          deleted=$(jq --raw-output '.ref' "${GITHUB_EVENT_PATH}")
          retired=0
          while IFS= read -r tag
          do
            [[ -n "${tag}" ]] || continue
            commit=$(git rev-parse --verify --quiet "${tag}^{commit}" || true)
            if [[ -z "${commit}" ]]
            then
              echo "::warning::${tag} has no commit here; leaving it"
              continue
            fi
            if git branch --remotes --contains "${commit}" | grep --quiet --invert-match 'origin/HEAD'
            then
              echo "keeping ${tag}: a branch still reaches ${commit:0:7}"
              continue
            fi
            gh release delete "${tag}" --cleanup-tag --yes
            echo "retired ${tag}: no branch reaches ${commit:0:7} since ${deleted} was deleted"
            retired=$(( retired + 1 ))
          done < <(gh release list --limit 1000 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName')
          echo "✅ Retired ${retired} pre-release(s)."

# ----------------------------------------------------------------------------------------------------------------------
