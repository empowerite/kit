# gate.yml - bin/gate on every pull request and on every push to main
name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request ends the run of the older one. A run on main is never ended, so every commit there
# has its answer.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
      - run: bin/gate
