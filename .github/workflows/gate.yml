# gate.yml - bin/gate on every pull request, with what it made, and kit as built, attached to the run
#
# There is no run on main. A pull request is up to date with main before it merges, and the merge squashes, so the
# tree that lands on main is the tree this run judged. A second job tells Codecov what the gate measured.
name: gate

on:
  pull_request:

permissions:
  contents: read

# A pull request's runs go one at a time, and none is ended for a newer push. A run in progress finishes, so its
# commit has a verdict, and the next run starts from the cache it saved. Of the pushes that come meanwhile, GitHub
# keeps the newest waiting and drops the others before they start.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The pull request's own head, and not GitHub's merge of it into main, so that kit as built here names a commit
      # of the pull request. The whole history comes with it, for the step below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # The head is judged alone, so it must hold all of main: then it is what the merge would be.
      - name: up to date
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git merge-base --is-ancestor "${BASE}" HEAD
          then
            echo "gate: this pull request is behind ${GITHUB_BASE_REF}: merge ${GITHUB_BASE_REF} into it" \
              | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      # setup-go finds Go on the runner. Its own cache is off: it is saved at a pull request's first run and never
      # again, so it does not follow the code. The steps around the gate keep one that does.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      # Go's build cache: what it compiled, and the answers of tests whose inputs have not changed. A run starts
      # from the newest one saved for this pull request, and saves its own under its commit.
      - name: cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ hashFiles('go.mod') }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            go-build-${{ hashFiles('go.mod') }}-

      # The tools kit.lock pins, as kit's cache holds them, kept between runs while kit.lock is the same. kit holds
      # each to the lock before it runs, so a cache that was changed is refused, never run.
      - name: tools
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/kit/tools
          key: kit-tools-${{ hashFiles('kit.lock') }}

      - name: gate
        id: gate
        run: bin/gate --keep="${RUNNER_TEMP}/gate"

      - name: build
        id: build
        run: bin/build --into="${RUNNER_TEMP}/kit"

      # What the gate leans on at GitHub: the rules on main. To read them is enough, and the job's token can. Its
      # verdict is kept with the gate's.
      - name: forge
        if: ${{ !cancelled() && steps.gate.conclusion != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/forge --keep="${RUNNER_TEMP}/gate"

      - name: save the tools
        if: ${{ !cancelled() && steps.gate.conclusion != 'skipped' && steps.tools.outputs.cache-hit != 'true' && hashFiles('kit.lock') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/kit/tools
          key: ${{ steps.tools.outputs.cache-primary-key }}

      # Saved whether the gate held or refused, since what it compiled is good either way. A run of a commit that
      # has a cache already saves none.
      - name: save the cache
        if: ${{ !cancelled() && steps.gate.conclusion != 'skipped' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: summary
        if: ${{ !cancelled() && steps.gate.conclusion != 'skipped' }}
        run: |
          {
            echo '### The gate'
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/gate/verdict.txt"
            echo '```'
            echo
            echo '### What the gate leans on at GitHub'
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/gate/forge.txt"
            echo '```'
            if [[ -x "${RUNNER_TEMP}/kit/kit-linux-amd64" ]]
            then
              echo
              echo '### The build'
              echo
              echo '```text'
              "${RUNNER_TEMP}/kit/kit-linux-amd64" version
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      # The gate's verdict and the forge's, and with them what go test printed and its coverage profile, whether
      # they held or refused. A gate that ran always keeps a verdict, so nothing to attach is an error.
      - name: results
        if: ${{ !cancelled() && steps.gate.conclusion != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/gate
          if-no-files-found: error

      # kit for linux and darwin, on amd64 and arm64, of a change the gate held.
      - name: executables
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: kit-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/kit
          if-no-files-found: error

  # Codecov is told what the gate measured: the coverage profile among the gate's results. It judges nothing, so no
  # rule asks for this job, and Codecov being down holds no merge. It is a job of its own so that its failure is seen.
  codecov:
    needs: gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The pull request's head, as the gate judged it: Codecov sets the profile's lines against these files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # A gate that refused before its tests kept no profile, and one that never started kept nothing: then there is
      # nothing to tell, and that is no error. A gate that held kept both, so their absence then is one.
      - name: results
        continue-on-error: ${{ needs.gate.result != 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: gate-${{ github.event.pull_request.head.sha }}
          path: gate-results

      - name: a gate that held kept a profile
        if: ${{ needs.gate.result == 'success' && hashFiles('gate-results/cover.out') == '' }}
        run: |
          echo 'codecov: the gate held, and its results hold no coverage profile' | tee -a "${GITHUB_STEP_SUMMARY}"
          exit 1

      # The repository's own upload token. The profile is named, so nothing else is looked for, and Codecov's
      # program is the one version named here.
      - name: codecov
        if: ${{ hashFiles('gate-results/cover.out') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gate-results/cover.out
          disable_search: true
          fail_ci_if_error: true
          version: v11.3.2
