# release.yml - a tag v<version> on main becomes a GitHub release carrying the kit as one tarball
# ----------------------------------------------------------------------------------------------------------------------
#
# The tarball is kit-<version>.tar.gz, holding one directory kit-<version>/ with bin/ and .kit/, the layout
# a consumer's mise unpacks and puts on PATH. Only a version tag starts a run, and the run refuses a tag whose
# commit is not on main (any commit on main, not only its head), a tag that is not v<major>.<minor>.<patch> with an
# optional pre-release suffix, and a tag whose version is not the one .kit/version records at that commit.
#
# see: .kit/1st.md

name: release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: tag-is-on-main
        run: |
          set -o errexit -o nounset -o pipefail
          default_branch=$(jq --raw-output '.repository.default_branch' "${GITHUB_EVENT_PATH}")
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${default_branch}"
          then
            echo "::error::${GITHUB_REF_NAME} is not on ${default_branch}; delete the tag and tag a commit on ${default_branch}"
            exit 1
          fi
          echo "✅ ${GITHUB_REF_NAME} is on ${default_branch}."

      - name: tag-matches-version
        run: |
          set -o errexit -o nounset -o pipefail
          tag_version=${GITHUB_REF_NAME#v}
          if [[ ! "${tag_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          then
            echo "::error::${GITHUB_REF_NAME} is not a version tag; a release tag is v<major>.<minor>.<patch>, with an optional -<pre-release>"
            exit 1
          fi
          file_version=$(cat .kit/version)
          if [[ "${tag_version}" != "${file_version}" ]]
          then
            echo "::error::the tag says ${tag_version} and .kit/version says ${file_version}; set .kit/version on main first, then tag"
            exit 1
          fi
          echo "✅ .kit/version is ${file_version}."

      - name: pack-and-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o errexit -o nounset -o pipefail
          version=${GITHUB_REF_NAME#v}
          staging=$(mktemp --directory)
          mkdir "${staging}/kit-${version}"
          cp --recursive bin .kit "${staging}/kit-${version}/"
          rm --force "${staging}/kit-${version}/.kit/manifest"
          tar --create --gzip --file "kit-${version}.tar.gz" --directory "${staging}" "kit-${version}"
          sha256sum "kit-${version}.tar.gz" > "kit-${version}.tar.gz.sha256"
          notes=$(printf 'Pin it in mise.toml:\n\n    [tools]\n    "github:empowerite/kit" = "%s"\n\nThen, in the repository: kit install\n' "${version}")
          flags=()
          [[ "${version}" == *-* ]] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" "kit-${version}.tar.gz" "kit-${version}.tar.gz.sha256" \
            --title "kit ${version}" --notes "${notes}" "${flags[@]}"
          echo "✅ Released kit ${version}."

# ----------------------------------------------------------------------------------------------------------------------
