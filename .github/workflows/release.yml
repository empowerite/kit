# release.yml - a tag v<version> on main becomes a GitHub release carrying the kit as one tarball
# ----------------------------------------------------------------------------------------------------------------------
#
# The tarball is kit-<version>.tar.gz, holding one directory kit-<version>/ with bin/, tree/, targets/, and version, the layout a consumer's mise unpacks and puts on PATH. Only a version tag starts a run. A release, v<major>.<minor>.<patch>,
# is tagged on main (any commit on main, not only its head). A pre-release, the same with a -<suffix>, is tagged on
# a commit that is not on main, and is published as a GitHub pre-release. Either way the file version at the tagged
# commit is the version without the suffix, the one under development, and the packed kit carries the tag's full
# version so a consumer pinning a pre-release sees it in kit version and .kit/manifest.
#
# see: .kit/1st.md

name: release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: tag-is-a-version
        run: |
          set -o errexit -o nounset -o pipefail
          tag_version=${GITHUB_REF_NAME#v}
          if [[ ! "${tag_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          then
            echo "::error::${GITHUB_REF_NAME} is not a version tag; a release is v<major>.<minor>.<patch>, a pre-release the same with -<suffix>"
            exit 1
          fi
          echo "✅ ${GITHUB_REF_NAME} is a version tag."

      - name: tag-is-on-the-right-side-of-main
        run: |
          set -o errexit -o nounset -o pipefail
          tag_version=${GITHUB_REF_NAME#v}
          default_branch=$(jq --raw-output '.repository.default_branch' "${GITHUB_EVENT_PATH}")
          on_main=false
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${default_branch}" && on_main=true
          if [[ "${tag_version}" == *-* && "${on_main}" == true ]]
          then
            echo "::error::${GITHUB_REF_NAME} is a pre-release tag on ${default_branch}; a pre-release is tagged on a branch commit, and a release on ${default_branch} carries no suffix"
            exit 1
          fi
          if [[ "${tag_version}" != *-* && "${on_main}" == false ]]
          then
            echo "::error::${GITHUB_REF_NAME} is not on ${default_branch}; a release is tagged on ${default_branch}, and a branch commit takes a pre-release tag with a -<suffix>"
            exit 1
          fi
          echo "✅ ${GITHUB_REF_NAME} is on the right side of ${default_branch} (on it: ${on_main})."

      - name: tag-matches-version
        run: |
          set -o errexit -o nounset -o pipefail
          tag_version=${GITHUB_REF_NAME#v}
          base_version=${tag_version%%-*}
          file_version=$(cat version)
          if [[ "${base_version}" != "${file_version}" ]]
          then
            echo "::error::the tag says ${base_version} and version says ${file_version}; set version at the tagged commit first"
            exit 1
          fi
          echo "✅ version is ${file_version}."

      - name: pack-and-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o errexit -o nounset -o pipefail
          version=${GITHUB_REF_NAME#v}
          staging=$(mktemp --directory)
          mkdir "${staging}/kit-${version}"
          cp --recursive --no-dereference bin tree targets version "${staging}/kit-${version}/"
          # the packed kit carries the tag's full version, suffix included; the repository file carries the base
          printf '%s\n' "${version}" > "${staging}/kit-${version}/version"
          tar --create --gzip --file "kit-${version}.tar.gz" --directory "${staging}" "kit-${version}"
          sha256sum "kit-${version}.tar.gz" > "kit-${version}.tar.gz.sha256"
          notes=$(printf 'Pin it in mise.toml:\n\n    [tools]\n    "github:empowerite/kit" = "%s"\n\nThen, in the repository: kit install\n' "${version}")
          flags=()
          [[ "${version}" == *-* ]] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" "kit-${version}.tar.gz" "kit-${version}.tar.gz.sha256" \
            --title "kit ${version}" --notes "${notes}" "${flags[@]}"
          echo "✅ Released kit ${version}."

# ----------------------------------------------------------------------------------------------------------------------
