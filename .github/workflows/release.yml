# release.yml - pushing a version tag publishes the kit as a GitHub release
# ----------------------------------------------------------------------------------------------------------------------
#
# Pushing a tag such as v0.1.0 runs this workflow. It has two steps, and each step is one kit command, so the
# same thing can be run on a laptop:
#
#   kit release verify    checks the tag. A release tag, v0.1.0, must point at a commit on main. A pre-release
#                         tag, v0.1.0-rc.1, must point at a commit that is not on main. Any other tag is refused.
#   kit release publish   packs this checkout into kit-<version>.tar.gz, writes the tag's version into it, and
#                         publishes it as a GitHub release. A tag with a suffix is published as a pre-release.
#
# GitHub does not let a published release change, so a version is tagged once and never again. A pre-release
# is deleted when the branch it was tagged on is deleted; see retire-pre-releases.yml.
#
# see: bin/kit-release.sh

name: release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: verify
        run: bin/kit release verify "${GITHUB_REF_NAME}"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/kit release publish "${GITHUB_REF_NAME}"

# ----------------------------------------------------------------------------------------------------------------------
