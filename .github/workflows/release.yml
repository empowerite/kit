# release.yml - a tag v<version> on main becomes a GitHub release carrying the kit as one tarball
# ----------------------------------------------------------------------------------------------------------------------
#
# Two steps, each one kit command, so a desk can run the same: `kit release verify` holds the tag to its shape and
# its side of main, and `kit release publish` packs this checkout as kit-<version>.tar.gz with the tag's version
# stamped in and publishes it, as a pre-release where the version has a suffix. Only a version tag starts a run.
# A published release is immutable, so a tag is never reused; a pre-release lives as long as the branch it was
# tagged on. see: .github/workflows/retire-pre-releases.yml
#
# see: bin/kit-release.sh

name: release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: verify
        run: bin/kit release verify "${GITHUB_REF_NAME}"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/kit release publish "${GITHUB_REF_NAME}"

# ----------------------------------------------------------------------------------------------------------------------
