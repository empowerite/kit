# kit-ci.yml - the check the kit delivers for GitHub Actions: kit ci on every pull request into the default branch
# ----------------------------------------------------------------------------------------------------------------------
# Runs one job, CI, on each pull request into the default branch. CI is the check name a ruleset requires. The job:
#
#   1. puts the toolchain the ci_toolchain answer names on the runner: mise, nix, or the devcontainer CLI (brew and
#      docker are already on GitHub's runners, and ambient needs nothing)
#   2. puts kit on PATH: the release kit.yml declares, downloaded from its GitHub release and unpacked only when
#      its bytes have the digest published beside it, or the checkout's own kit/bin/ when it declares unreleased
#   3. installs the gate's tools with `kit tools install`, through that toolchain: KIT_TOOLCHAIN names it
#   4. runs `kit ci`: `kit linked`, `kit policy`, the gate, and `kit check`, and reports every result
#
# When a pull request closes, a second job, Settle, runs `kit settle` on it: an issue in another tracker that a merged
# pull request's body closes is closed, and the issues of one closed without merging are backlog again. It alone may
# write to issues. It reads the other trackers with the repository's secrets: AZURE_DEVOPS_EXT_PAT for Azure DevOps.
#
# Added by kit's github/ci package. To remove it, run kit packages remove github/ci.
# To change it, do not edit it here: see "Changing what kit adds" in .kit/1st.md.
# runs-on is the ci_runner value under answers: in kit.yml; timeout-minutes is its ci_timeout_minutes value;
# KIT_TOOLCHAIN is its ci_toolchain value.
#
# see: .kit/1st.md

name: kit

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, closed]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  CI:
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: "@ci_runner@"
    # A hung step fails the job after this many minutes, not after GitHub's six hours. fromJSON makes the answer a
    # number, and keeps the template YAML, where a value cannot start with @.
    timeout-minutes: ${{ fromJSON('@ci_timeout_minutes@') }}
    env:
      # mise also reads mise.ci.toml, on top of mise.toml, for the tools only a runner needs.
      MISE_ENV: ci
      # The toolchain the project uses on this runner; kit refuses a named toolchain it cannot use.
      KIT_TOOLCHAIN: "@ci_toolchain@"
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # kit policy reads every commit since the branch forked from the default branch.
          fetch-depth: 0

      - name: mise-on-path
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        if: ${{ env.KIT_TOOLCHAIN == 'mise' }}
        with:
          install: false

      - name: nix-on-path
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # v23
        if: ${{ env.KIT_TOOLCHAIN == 'nix' }}

      - name: devcontainer-on-path
        if: ${{ env.KIT_TOOLCHAIN == 'devcontainer' }}
        run: |
          set -o errexit -o nounset -o pipefail
          npm install --global @devcontainers/cli@0.90.0

      - name: kit-on-path
        run: |
          set -o errexit -o nounset -o pipefail
          version=$(sed -n 's/^version: *//p' kit.yml 2>/dev/null | sed "s/[[:space:]]*#.*//; s/^[\"']//; s/[\"']$//")
          if [[ -z "${version}" ]]
          then
            echo '::error::run kit install and commit what it writes; kit.yml declares no kit version'
            exit 1
          fi
          if [[ "${version}" == unreleased && -x kit/bin/kit ]]
          then
            printf '%s/kit/bin\n' "${PWD}" >> "${GITHUB_PATH}"
          elif [[ "${version}" == unreleased ]]
          then
            echo '::error::kit.yml declares unreleased and there is no kit/bin/kit; pin a release and run kit update'
            exit 1
          elif ! command -v kit >/dev/null
          then
            tarball="https://github.com/empowerite/kit/releases/download/release/${version}/kit-${version}.tar.gz"
            curl --fail --silent --location --output "${RUNNER_TEMP}/kit-${version}.tar.gz" "${tarball}"
            curl --fail --silent --location --output "${RUNNER_TEMP}/kit-${version}.tar.gz.sha256" "${tarball}.sha256"
            # Nothing from the tarball runs until its bytes have the digest the release publishes beside it.
            if ! (cd "${RUNNER_TEMP}" && shasum --algorithm 256 --check --status "kit-${version}.tar.gz.sha256")
            then
              echo "::error::kit-${version}.tar.gz does not have the digest its release publishes; it is not unpacked"
              exit 1
            fi
            mkdir -p "${RUNNER_TEMP}/kit"
            tar --extract --gzip --file "${RUNNER_TEMP}/kit-${version}.tar.gz" --directory "${RUNNER_TEMP}/kit" \
              --strip-components 1
            printf '%s/kit/bin\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          fi

      - name: toolchain
        run: |
          set -o errexit -o nounset -o pipefail
          kit tools install && kit tools path >> "${GITHUB_PATH}"

      - name: kit-ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: kit ci

  Settle:
    if: github.event.action == 'closed'
    runs-on: "@ci_runner@"
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: kit-on-path
        run: |
          set -o errexit -o nounset -o pipefail
          version=$(sed -n 's/^version: *//p' kit.yml 2>/dev/null | sed "s/[[:space:]]*#.*//; s/^[\"']//; s/[\"']$//")
          if [[ -z "${version}" ]]
          then
            echo '::error::run kit install and commit what it writes; kit.yml declares no kit version'
            exit 1
          fi
          if [[ "${version}" == unreleased && -x kit/bin/kit ]]
          then
            printf '%s/kit/bin\n' "${PWD}" >> "${GITHUB_PATH}"
          elif [[ "${version}" == unreleased ]]
          then
            echo '::error::kit.yml declares unreleased and there is no kit/bin/kit; pin a release and run kit update'
            exit 1
          elif ! command -v kit >/dev/null
          then
            tarball="https://github.com/empowerite/kit/releases/download/release/${version}/kit-${version}.tar.gz"
            curl --fail --silent --location --output "${RUNNER_TEMP}/kit-${version}.tar.gz" "${tarball}"
            curl --fail --silent --location --output "${RUNNER_TEMP}/kit-${version}.tar.gz.sha256" "${tarball}.sha256"
            # Nothing from the tarball runs until its bytes have the digest the release publishes beside it.
            if ! (cd "${RUNNER_TEMP}" && shasum --algorithm 256 --check --status "kit-${version}.tar.gz.sha256")
            then
              echo "::error::kit-${version}.tar.gz does not have the digest its release publishes; it is not unpacked"
              exit 1
            fi
            mkdir -p "${RUNNER_TEMP}/kit"
            tar --extract --gzip --file "${RUNNER_TEMP}/kit-${version}.tar.gz" --directory "${RUNNER_TEMP}/kit" \
              --strip-components 1
            printf '%s/kit/bin\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          fi

      - name: kit-settle
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
          PR: ${{ github.event.pull_request.number }}
        run: kit settle "${PR}"

# ----------------------------------------------------------------------------------------------------------------------
