# packages/agents/cursor/package.yml - the agents/cursor package: a Cursor rule per kind, attached by path, pointing at the rule
# ----------------------------------------------------------------------------------------------------------------------
# see: docs/packages.md, docs/packages/agents/cursor.md

description: "Cursor: a rule under .cursor/rules/ per kit rule, and the kit's MCP server"
depends:
  - kit
  - agents/generic
notices:
  - path: .cursor/mcp.json
    text: "Cursor starts the kit server this file names, and asks before it runs each of its tools unless you allow it"
