# Added by the kit package, which kit always installs.
# To change it, do not edit it here: see "Changing what kit adds" in .kit/1st.md.
#
# A bash file: by its suffix, or by its shebang when it has no suffix. A kind that lists bash under embeds: holds bash
# inside its own files, so kit context hands the bash rule to whoever opens one of those.
paths:
  - "**/*.sh"
  - "**/*.bash"
content:
  - "^#!.*/(env +)?(ba)?sh( |$)"
