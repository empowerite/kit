# kit:generated -- the bash kind, from the kit package
# see: "Changing what kit adds" in .kit/1st.md, to replace it
#
# A bash file: by its suffix, or by its bash shebang when it has no suffix; #!/bin/sh is the sh kind. A kind that
# lists bash under embeds: holds bash inside its own files, so kit context hands the bash rule to whoever opens one
# of those.
name: bash
paths:
  - "**/*.sh"
  - "**/*.bash"
content:
  - "^#!.*/(env +)?bash( |$)"
