# kit:generated -- the pre-commit hook a repository's lefthook.yml extends, from the hooks/lefthook package
# see: kit packages remove hooks/lefthook, or "Changing what kit adds" in .kit/1st.md
#
# The pre-commit hook runs two commands over the staged files:
#
#   - kit-lint runs kit lint: each rule's own linter, declared in the rule's frontmatter, over the files the rule
#     governs. It reads the staged files itself, as lefthook's list leaves out a staged file that is not on the disk,
#     which kit lint refuses
#   - kit-generate runs kit generate --check, which fails when a generated region is stale
#
# The repository's lefthook.yml includes this file with `extends: [.kit/lefthook.yml]`, and can add commands of its
# own. Lefthook merges commands by name. Run `kit hydrate && lefthook install` once per clone: kit hydrate places
# this file, and lefthook skips a missing include without a word.
#
# see: https://lefthook.dev

pre-commit:
  commands:
    kit-lint:
      run: kit lint
    kit-generate:
      run: kit generate --check {staged_files}
