# tutorials.yml - the catalogue of kit's tutorials, which kit tutorials lists as buttons
# ----------------------------------------------------------------------------------------------------------------------
# kit generate writes the region below from the front matter of the tutorials site's top-level pages, so a tutorial is
# described in one place, its page. Edit a page, then run kit generate; a hand edit here makes the region stale.
# Only kit's own source repository has bin/tutorials; anywhere else, as in a repository that carries this release, the
# region's command reprints the region as it stands, so it is never stale.

# kit:generate catalogue `if [[ -x bin/tutorials ]]; then bin/tutorials catalogue; else awk -v r="$KIT_GENERATE_REGION" '$0 ~ "^# kit:end " r "$" {p=0} p {print} $0 ~ "^# kit:generate " r " " {p=1}' "$KIT_GENERATE_FILE"; fi`
audiences:
  - id: newcomer
    label: Just starting
  - id: ui
    label: UI
  - id: maintainer
    label: Maintainer
tutorials:
  - id: kit-tutorials
    path: kit-tutorials/
    title: Reading kit's tutorials
    summary: How the tutorials are laid out, who each one is for, and how a page tells you that your kit is too old for a passage.
    glyph: "\U0001F393"
    audience:
      - newcomer
    order: 1
# kit:end catalogue
