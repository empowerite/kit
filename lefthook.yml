# lefthook.yml - this repository's git hooks; see: https://lefthook.dev
# ----------------------------------------------------------------------------------------------------------------------
#
# The linters come from the kit's installed .kit/lefthook.yml, as in any consumer repository: kit lint over the
# staged paths. This repository adds a step that refreshes its installed copies. Once per clone, run:
# lefthook install

extends:
  - .kit/lefthook.yml

pre-commit:
  commands:
    # When a commit changes what the installed copies are rendered from (the modules, the kit that renders them, or
    # the settings that fill their templates), rebuild the copies in the same commit. The script stages them.
    refresh:
      glob: "{kit/**,.kit/settings.yml}"
      run: bin/refresh

# ----------------------------------------------------------------------------------------------------------------------
