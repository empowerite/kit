# lefthook.yml - this repository's git hooks; see: https://lefthook.dev
# ----------------------------------------------------------------------------------------------------------------------
#
# The kit's own linters come from its installed fragment, the way a consumer takes them; the dispatcher, which
# carries no extension, and the refresh of the installed copies are this repository's own. Once per clone:
# lefthook install

extends:
  - .kit/lefthook.yml

pre-commit:
  commands:
    shellcheck-dispatcher:
      glob: "bin/kit"
      run: shellcheck --shell=bash --external-sources {staged_files}
    markdownlint:
      glob: "*.md"
      run: markdownlint-cli2 {staged_files}
    # A commit that changes the source of a delivered file rewrites the installed copies in the same commit, from
    # the index, so nobody remembers just refresh. The recipe stages what it rewrote; stage_fixed would re-stage
    # only the source paths it was handed.
    refresh:
      glob: "{tree,targets}/**"
      run: just refresh
