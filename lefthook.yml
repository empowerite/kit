# lefthook.yml - this repository's git hooks; see: https://lefthook.dev
# ----------------------------------------------------------------------------------------------------------------------
#
# The linters come from the kit's installed fragment, the way a consumer takes them: kit lint over the staged
# paths, each rule's own linter. This repository adds the refresh of its installed copies. Once per clone:
# lefthook install

extends:
  - .kit/lefthook.yml

pre-commit:
  commands:
    # A change to a delivered file's source rewrites the installed copies in the same commit; the recipe stages
    # what it rewrote.
    refresh:
      glob: "modules/**"
      run: just refresh

# ----------------------------------------------------------------------------------------------------------------------
