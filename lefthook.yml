# lefthook.yml - this repository's git hooks; see: https://lefthook.dev
# ----------------------------------------------------------------------------------------------------------------------
#
# The kit's own linters come from its installed fragment, the way a consumer takes them; the dispatcher, which
# carries no extension, and the refresh of the installed copies are this repository's own. Once per clone:
# lefthook install

extends:
  - .kit/lefthook.yml

pre-commit:
  commands:
    shellcheck-dispatcher:
      glob: "bin/kit"
      run: shellcheck --shell=bash --external-sources {staged_files}
    # A commit that changes the source of a delivered file rewrites the installed copies in the same commit, so
    # nobody remembers just refresh. The command stages what it rewrote itself: stage_fixed would re-stage only
    # the source paths it was handed, and the copies live elsewhere.
    refresh:
      glob: "{tree,targets}/**"
      run: just refresh && git add .kit .claude .github/workflows/kit-ci.yml
